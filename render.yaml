databases:
  - name: compliance-task-manager-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: compliance-task-manager-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: compliance-task-manager-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
